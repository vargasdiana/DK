<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz para Karina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Outfit:wght@400;600;700&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap">
<style>
/* Layout: una pantalla a la vez. Tres pantallas de entrada, seis preguntas con dedicatoria que se revela (tarjeta PNG + audio MP3) y un final morado pastel. */
:root{
  --bg:#e3f6ee; --surface:#ffffff; --ink:#12332b; --muted:#4d6d63;
  --coral:#ff4d5e; --on-coral:#ffffff; --sun:#ffc933;
  --line:#12332b; --shadow:#12332b;
  --f-display:"Bagel Fat One","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cita:"Fraunces",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f2620; --surface:#18382f; --ink:#e3f6ee; --muted:#9fc4b7;
    --coral:#ff6f7d; --on-coral:#12332b; --line:#e3f6ee; --shadow:#06130f; color-scheme:dark;
  }
}
/* final: morado pastel */
body.morado{--bg:#d9cdf4; --surface:#efe9fc; --ink:#2b2050; --muted:#5d5188; --line:#2b2050; --shadow:#2b2050; --coral:#ff4d5e; --on-coral:#ffffff; --flor:#b79de8; --flor-c:#fff0b3; --estrella:#ffffff}
@media (prefers-color-scheme: dark){
  body.morado{--bg:#43376e; --surface:#54478a; --ink:#f1ebff; --muted:#cfc4ef; --line:#f1ebff; --shadow:#1d1538; --coral:#ff6f7d; --on-coral:#2b2050; --flor:#7d68bb; --flor-c:#ffe9a0; --estrella:#e9deff}
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); transition:background .5s;
  font-family:var(--f-body); font-size:1.08rem; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:calc(28px + env(safe-area-inset-top, 0px));
  padding-bottom:calc(64px + env(safe-area-inset-bottom, 0px));
  min-height:100vh;
}
main{max-width:36rem; margin:0 auto; display:flex; flex-direction:column; gap:1.8rem}
h1,h2{font-family:var(--f-display); font-weight:400; line-height:1.1; margin:0; text-wrap:balance}
h2{font-size:1.75rem}
h2.grande{font-size:clamp(2.4rem,11vw,3.6rem)}
p{margin:0}
[hidden]{display:none !important}

/* progreso */
.discos{display:flex; gap:.6rem; align-items:center}
.disco{
  width:26px; height:26px; flex:none; border-radius:50%; border:2.5px solid var(--line); background:var(--surface);
  display:grid; place-items:center; transition:background .25s, transform .25s;
}
.disco::after{content:""; width:7px; height:7px; border-radius:50%; background:var(--line); opacity:.35}
.disco.actual{transform:scale(1.18); border-color:var(--coral)}
.disco.hecho{background:var(--coral)}
.disco.hecho::after{background:var(--sun); opacity:1}
.cuenta{margin-left:auto; font-weight:700; font-variant-numeric:tabular-nums; color:var(--muted); text-align:right}

/* tarjetas y botones */
.tarjeta{
  background:var(--surface); border:2.5px solid var(--line); border-radius:1.4rem;
  box-shadow:6px 6px 0 var(--shadow); padding:1.5rem 1.3rem; display:flex; flex-direction:column; gap:1.2rem;
}
.entrada{align-items:flex-start; padding-block:2rem}
.portada-txt{font-family:var(--f-display); font-size:clamp(1.8rem,7.5vw,2.6rem); line-height:1.15; text-wrap:balance}
.acciones{display:flex; flex-wrap:wrap; gap:.8rem; align-items:center}
.zona{display:flex; flex-direction:column; gap:1.2rem; align-items:stretch}
.opciones{display:flex; flex-direction:column; gap:.7rem}
.op{
  font:inherit; font-weight:600; text-align:left; color:var(--ink); cursor:pointer;
  background:var(--bg); border:2.5px solid var(--line); border-radius:1rem; padding:.85rem 1rem;
  transition:transform .12s, background .12s;
}
.op:hover:not(:disabled){transform:translateX(4px)}
.op:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.op.bien{background:#3fcf8e; color:#0c2b20}
.op.mal{background:transparent; color:var(--muted); border-style:dashed; text-decoration:line-through}
.op.tiembla{animation:tiembla .4s}
.op:disabled{cursor:default}
@keyframes tiembla{20%{transform:translateX(-7px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}}
.pista{min-height:1.5em; font-weight:600; color:var(--muted)}
.btn{
  display:inline-block; text-decoration:none; font:inherit; font-weight:700; font-size:1.05rem; cursor:pointer;
  background:var(--coral); color:var(--on-coral); border:2.5px solid var(--line); border-radius:999px;
  padding:.7em 1.6em; box-shadow:4px 4px 0 var(--shadow); transition:transform .12s, box-shadow .12s;
}
.btn:hover{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--shadow)}
.btn:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--shadow)}
.btn:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.btn.sec{background:transparent; color:var(--ink); box-shadow:none; padding:.6em 1.2em; font-size:1rem}
.btn.sec:hover{transform:none; background:color-mix(in srgb, var(--ink) 8%, transparent)}

/* dedicatoria: imagen original + audio */
.revela{display:flex; flex-direction:column; gap:1rem; animation:sube .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes sube{from{transform:translateY(16px) scale(.97); opacity:0} to{transform:none; opacity:1}}
.cancion{font-weight:600; color:var(--muted)}
.marco{display:flex; justify-content:center}
.tarjeta-img{width:100%; height:auto; max-height:75vh; object-fit:contain; border-radius:1rem; display:block}
.falta{
  border:2.5px dashed var(--line); border-radius:1rem; padding:1.4rem 1rem; text-align:center; font-weight:600; color:var(--muted);
}
.voz{display:flex; flex-direction:column; gap:.5rem}
.voz-tit{font-weight:700}
.voz audio{width:100%}
.nota{min-height:1.4em; font-weight:600; color:var(--muted)}

/* final */
.final{
  position:relative; overflow:hidden; border-radius:1.6rem; min-height:72vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:1.6rem;
  padding:4rem 1.4rem;
}
.final > *:not(.deco){position:relative; z-index:1}
.cita-final{font-family:var(--f-cita); font-style:italic; font-weight:500; font-size:clamp(1.7rem,7.2vw,2.5rem); line-height:1.3; text-wrap:balance; max-width:28rem}
.final .acciones{justify-content:center}
.deco{position:absolute; z-index:0; animation:flota 7s ease-in-out infinite alternate}
.d1{width:64px; top:5%; left:6%} .d2{width:44px; top:12%; right:8%; animation-delay:-2s}
.d3{width:52px; bottom:9%; left:10%; animation-delay:-4s} .d4{width:70px; bottom:6%; right:6%; animation-delay:-1s}
.d5{width:20px; top:24%; left:22%; animation-delay:-3s} .d6{width:16px; top:30%; right:20%; animation-delay:-5s}
.d7{width:22px; bottom:26%; right:24%; animation-delay:-2.5s} .d8{width:14px; bottom:30%; left:18%; animation-delay:-6s}
.d9{width:18px; top:6%; left:46%; animation-delay:-1.5s}
@keyframes flota{from{transform:translateY(-6px) rotate(-4deg)} to{transform:translateY(7px) rotate(5deg)}}

@media (prefers-reduced-motion: reduce){
  body,.btn,.disco,.op{transition:none}
  .revela,.deco,.op.tiembla{animation:none}
}
</style>
</head>
<body>
<main>
  <div class="discos" id="discos" aria-hidden="true" hidden></div>
  <section id="escena" aria-live="polite"></section>
</main>

<script>
(function(){
  /* Archivos esperados en la carpeta assets (los PNG los copias tú):
     assets/Clip 1.png ... assets/Clip 6.png
     assets/Clip 1.mp3 ... assets/Clip 6.mp3
     assets/DK.mp3 */
  var PREGUNTAS = [
    { q: "¿Qué se le dice a alguien que tuvo un mal día?",
      o: [["Cálmate, no es para tanto", 0], ["Ven, cuéntame todo", 1], ["Eso le pasa a todos", 0]],
      pista: "Casi. Piensa en lo que a ti te gustaría escuchar.",
      cancion: "Yo contigo, tú conmigo", artista: "Morat y Álvaro Soler" },
    { q: "¿Qué combina mejor con una tarde de lluvia?",
      o: [["Una hoja de Excel", 0], ["Una reunión larga", 0], ["Frazada, snack y buena música", 1]],
      pista: "Ouch. Intenta con algo más abrigado.",
      cancion: "Eres tú", artista: "Morat" },
    { q: "¿Cuántas sonrisas al día hacen falta para estar de buen humor?",
      o: [["Ninguna, qué pereza", 0], ["Solo los domingos", 0], ["Al menos una, y cuenta la tonta", 1]],
      pista: "No tan rápido. Sonreír sí suma.",
      cancion: "Para que nadie se entere", artista: "Morat" },
    { q: "¿Cuál es el mejor plan para un sábado?",
      o: [["Lavar el baño", 0], ["Salir a comer rico con buena compañía", 1], ["Esperar a que llegue el lunes", 0]],
      pista: "Nop. Ese plan no anima a nadie.",
      cancion: "A dónde vamos", artista: "Morat" },
    { q: "¿Qué se necesita para cantar a todo pulmón en el carro?",
      o: [["Voz afinada", 0], ["Cero vergüenza", 1], ["Que nadie te mire", 0]],
      pista: "Tentador, pero la voz no es lo importante.",
      cancion: "Feo", artista: "Morat" },
    { q: "¿Quién se merece una sonrisa hoy?",
      o: [["Karina", 1], ["Karina, sin duda", 1], ["Karina, obvio", 1]],
      pista: "",
      cancion: "Aprender a quererte", artista: "Morat" }
  ];
  var IMAGENES = [1,2,3,4,5,6].map(function(n){ return "assets/Clip " + n + ".png"; });
  var AUDIOS   = [1,2,3,4,5,6].map(function(n){ return "assets/Clip " + n + ".mp3"; });
  var AUDIO_FINAL = "assets/DK.mp3";
  var CITA = "«No importa cuánto dure tu invierno, espero que no pierdas la esperanza de volver a ver florecer tus días».";

  var $ = function(id){ return document.getElementById(id); };
  var escena = $("escena"), discos = $("discos");
  var i = 0, revelado = [], audioActual = null;

  PREGUNTAS.forEach(function(){
    var d = document.createElement("span"); d.className = "disco"; discos.appendChild(d);
  });
  var cuenta = document.createElement("span"); cuenta.className = "cuenta"; discos.appendChild(cuenta);

  function pintarDiscos(){
    discos.querySelectorAll(".disco").forEach(function(d, k){
      d.className = "disco" + (revelado[k] ? " hecho" : "") + (k === i ? " actual" : "");
    });
    cuenta.textContent = "Pregunta " + (i + 1) + " de " + PREGUNTAS.length;
  }
  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if(cls){ e.className = cls; }
    if(txt){ e.textContent = txt; }
    return e;
  }
  function boton(txt, cls, fn){
    var b = el("button", "btn" + (cls ? " " + cls : ""), txt);
    b.type = "button"; b.addEventListener("click", fn); return b;
  }
  function detenerAudio(){
    if(audioActual){ try { audioActual.pause(); } catch(e){} audioActual = null; }
  }
  function limpiar(){ detenerAudio(); escena.textContent = ""; }
  function arriba(){ window.scrollTo(0, 0); }

  /* entrada: tres pantallas en secuencia */
  function portada(){
    document.body.classList.remove("morado");
    discos.hidden = true; limpiar();
    var t = el("article", "tarjeta entrada");
    t.appendChild(el("p", "portada-txt", "Tengo unas cuantas preguntas para ti... y algunas respuestas podrían sorprenderte. 👀"));
    t.appendChild(boton("Comenzar", "", function(){ lista1(); arriba(); }));
    escena.appendChild(t);
  }
  function pantallaEntrada(titulo, textoBoton, siguiente){
    limpiar();
    var t = el("article", "tarjeta entrada");
    t.appendChild(el("h2", "grande", titulo));
    t.appendChild(boton(textoBoton, "", function(){ siguiente(); arriba(); }));
    escena.appendChild(t);
  }
  function lista1(){ pantallaEntrada("¿Estás lista?", "¡Claro que sí!", lista2); }
  function lista2(){ pantallaEntrada("¿De veritas estás lista? 👀", "Ahora sí, prometo", empezar); }
  function empezar(){
    i = 0; revelado = PREGUNTAS.map(function(){ return false; });
    discos.hidden = false; pregunta();
  }

  /* preguntas: una por pantalla, con dedicatoria que se revela */
  function pregunta(){
    limpiar(); pintarDiscos();
    var P = PREGUNTAS[i];
    var ultima = i === PREGUNTAS.length - 1;
    var t = el("article", "tarjeta");
    t.appendChild(el("h2", "", P.q));
    var zona = el("div", "zona");
    var nav = el("div", "acciones");
    t.appendChild(zona); t.appendChild(nav);

    function pintarNav(){
      nav.textContent = "";
      if(i > 0){ nav.appendChild(boton("Anterior", "sec", function(){ i--; pregunta(); arriba(); })); }
      if(revelado[i]){
        nav.appendChild(boton(ultima ? "Continuar" : "Siguiente pregunta", "", function(){
          if(ultima){ final(); } else { i++; pregunta(); arriba(); }
        }));
      }
    }

    function mostrar(autoplay){
      zona.classList.add("abierta");
      var r = el("div", "revela");

      /* tarjeta PNG original, sin recortes ni deformaciones */
      var marco = el("div", "marco");
      var img = el("img", "tarjeta-img");
      img.alt = "Tarjeta " + (i + 1) + " de " + PREGUNTAS.length;
      img.src = encodeURI(IMAGENES[i]);
      var ruta = IMAGENES[i];
      img.addEventListener("error", function(){
        marco.textContent = "";
        marco.appendChild(el("p", "falta", "Falta el archivo «" + ruta + "». Cópialo en la carpeta assets."));
      });
      marco.appendChild(img); r.appendChild(marco);

      r.appendChild(el("p", "cancion", "Esta va con «" + P.cancion + "» de " + P.artista));

      var v = el("div", "voz");
      v.appendChild(el("p", "voz-tit", "Mi dedicatoria para ti"));
      var au = el("audio"); au.controls = true; au.preload = "auto"; au.setAttribute("playsinline", ""); au.src = encodeURI(AUDIOS[i]);
      var nota = el("p", "nota");
      var rutaAudio = AUDIOS[i];
      au.addEventListener("error", function(){ nota.textContent = "Falta el archivo «" + rutaAudio + "»."; });
      v.appendChild(au); v.appendChild(nota); r.appendChild(v);
      zona.appendChild(r);
      audioActual = au;
      if(autoplay){
        var p = au.play();
        if(p && p.catch){ p.catch(function(){ if(!nota.textContent){ nota.textContent = "Toca ▶ para escuchar mi dedicatoria."; } }); }
      }
    }

    function opciones(){
      var ops = el("div", "opciones");
      var pista = el("p", "pista");
      var botones = [];
      P.o.forEach(function(op){
        var b = el("button", "op", op[0]);
        b.type = "button";
        b.addEventListener("click", function(){
          if(op[1]){
            botones.forEach(function(x){ x.disabled = true; });
            b.classList.add("bien");
            pista.textContent = "";
            revelado[i] = true; pintarDiscos();
            mostrar(true); pintarNav();
          } else {
            b.classList.remove("tiembla"); void b.offsetWidth; b.classList.add("tiembla");
            b.classList.add("mal"); b.disabled = true;
            pista.textContent = P.pista;
          }
        });
        botones.push(b); ops.appendChild(b);
      });
      zona.appendChild(ops); zona.appendChild(pista);
    }

    /* la imagen y el audio aparecen solo después de responder bien */
    if(revelado[i]){ mostrar(false); } else { opciones(); }
    pintarNav();
    escena.appendChild(t);
  }

  /* final en morado pastel */
  var FLOR = '<svg class="deco CLS" viewBox="0 0 40 40" aria-hidden="true"><g fill="var(--flor)">' +
    [0,72,144,216,288].map(function(a){ return '<ellipse cx="20" cy="9" rx="5.5" ry="8" transform="rotate(' + a + ' 20 20)"/>'; }).join("") +
    '</g><circle cx="20" cy="20" r="4.5" fill="var(--flor-c)"/></svg>';
  var ESTRELLA = '<svg class="deco CLS" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.2 8.8L23 12l-8.8 2.2L12 23l-2.2-8.8L1 12l8.8-2.2z" fill="var(--estrella)"/></svg>';
  function deco(tpl, cls){ return tpl.replace("CLS", cls); }

  function final(){
    limpiar();
    discos.hidden = true;
    document.body.classList.add("morado");
    var f = el("article", "final");
    f.innerHTML = deco(FLOR, "d1") + deco(FLOR, "d2") + deco(FLOR, "d3") + deco(FLOR, "d4") +
      deco(ESTRELLA, "d5") + deco(ESTRELLA, "d6") + deco(ESTRELLA, "d7") + deco(ESTRELLA, "d8") + deco(ESTRELLA, "d9");
    f.appendChild(el("p", "cita-final", CITA));

    var au = el("audio"); au.preload = "auto"; au.src = encodeURI(AUDIO_FINAL);
    audioActual = au;
    var nota = el("p", "nota");
    var b = boton("Escuchar 💜", "", function(){
      if(au.paused){
        var p = au.play();
        if(p && p.catch){ p.catch(function(){ nota.textContent = "No se pudo reproducir. Vuelve a tocar el botón."; }); }
      } else { au.pause(); }
    });
    au.addEventListener("play", function(){ b.textContent = "Pausar"; nota.textContent = ""; });
    au.addEventListener("pause", function(){ if(!au.ended){ b.textContent = "Seguir escuchando 💜"; } });
    au.addEventListener("ended", function(){ b.textContent = "Volver a escuchar 💜"; });
    au.addEventListener("error", function(){ nota.textContent = "Falta el archivo «" + AUDIO_FINAL + "»."; });
    f.appendChild(b); f.appendChild(nota);

    var ac = el("div", "acciones");
    ac.appendChild(boton("Volver a las preguntas", "sec", function(){ document.body.classList.remove("morado"); discos.hidden = false; i = PREGUNTAS.length - 1; pregunta(); arriba(); }));
    ac.appendChild(boton("Empezar de nuevo", "sec", function(){ portada(); arriba(); }));
    f.appendChild(ac);
    escena.appendChild(f);
    arriba();
  }

  portada();
})();
</script>
</body>
</html>
